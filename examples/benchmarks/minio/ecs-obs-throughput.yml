# Short single-load-generator run across four ECS data endpoints. Increase the
# duration/repetitions only after the fixed-count qualification succeeds.
mode: serial
workdir: /tmp/sbk-analytics/benchmarks/minio/ecs-obs-throughput
cleanup_before_run: true

sbk:
  time: ms
  idletimeoutseconds: 120
  # SBK 10.7 accepts one endpoint or a comma-separated pool through `url`.
  url: http://10.236.66.181:9020,http://10.236.66.182:9020,http://10.236.66.183:9020,http://10.236.66.184:9020
  bucket: sbk-analytics-ecs-obs
  extra-headers: x-emc-namespace=sbk-ns
  retry-max-attempts: 1
  endpoint-preflight: all
  endpoint-metrics: true
  warmup-requests: 4
  warmup-operation: connection
  data-seed: 20260902
  data-compressibility: 0
  data-dedupable: false
  seconds: 30

benchmarks:
  ecs-four-endpoint-put-1m:
    minio:
      prefix: throughput-1m
      writers: 4
      size: 1048576

  ecs-four-endpoint-get-1m:
    minio:
      prefix: throughput-1m
      readers: 4
      size: 1048576
      read-operation: get
      verify-read-size: true

sbk-charts:
  output: ecs-obs-throughput.xlsx
  ai_model: noai
  chat: false
