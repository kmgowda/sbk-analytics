# Small, fixed-count ECS/OBS qualification. Credentials are intentionally not
# stored here: export SBK_S3_ACCESS_KEY and SBK_S3_SECRET_KEY before running.
mode: serial
workdir: /tmp/sbk-analytics/benchmarks/minio/ecs-obs-qualification
cleanup_before_run: true

sbk:
  time: ms
  idletimeoutseconds: 120
  url: http://10.236.66.181:9020
  bucket: sbk-analytics-ecs-obs
  extra-headers: x-emc-namespace=sbk-ns
  retry-max-attempts: 1
  endpoint-preflight: all
  endpoint-metrics: true
  warmup-requests: 1
  warmup-operation: connection
  data-seed: 20260902
  data-compressibility: 0
  data-dedupable: false

benchmarks:
  # Populate twenty reusable 1 MiB objects.
  ecs-put-1m:
    minio:
      prefix: qualification-1m
      writers: 1
      size: 1048576
      records: 20

  ecs-get-1m:
    minio:
      prefix: qualification-1m
      readers: 1
      size: 1048576
      records: 20
      read-operation: get
      verify-read-size: true

  ecs-range-get-4k:
    minio:
      prefix: qualification-1m
      readers: 1
      size: 4096
      records: 20
      read-operation: range-get
      range-offset: 8192
      range-length: 4096
      range-offset-distribution: fixed
      range-window-length: 1048576
      range-alignment: 4096
      verify-read-size: true

  ecs-list:
    minio:
      readers: 1
      size: 1
      records: 5
      read-operation: list
      list-prefixes: qualification-1m
      list-max-keys: 1000
      list-max-entries: 1000
      list-api-version: 2

  # Validate multipart completion separately from ordinary PUT.
  ecs-multipart-put-15m:
    minio:
      prefix: qualification-multipart-15m
      writers: 1
      size: 15728640
      records: 2
      part-size: 5242880
      mpu-concurrent-parts: 3

sbk-charts:
  output: ecs-obs-qualification.xlsx
  ai_model: noai
  chat: false
