# Single-writer benchmark on `file` and `rocksdb`, 60s each.
mode: serial
workdir: /tmp/sbk-analytics
# Set true to prevent old YAML, CSV, log, report, and benchmark-data files from
# accumulating in workdir across runs. Default: false.
cleanup_before_run: false

sbk:
  seconds: 60
  size: 100
  time: ns
  writers: 1

benchmarks:
  - class: file
    file: /tmp/sbk-analytics/file-60s.dat
  - class: rocksdb
    rfile: /tmp/sbk-analytics/rocksdb-60s

sbk-charts:
  output: file-rocksdb-write-60s.xlsx
  ai_model: noai
