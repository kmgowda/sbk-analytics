name: tests

on:
  push:
  pull_request:

jobs:
  standalone-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap without a prepared Python environment
        shell: bash
        env:
          SBK_ANALYTICS_ENV_HOME: ${{ runner.temp }}/sbk-analytics-runtime
        run: |
          ./sbk-analytics --version
          SBK_ANALYTICS_BOOTSTRAP_OFFLINE=1 ./sbk-analytics --version

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  conda:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: sbk-analytics
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
