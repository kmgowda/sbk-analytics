[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbk-analytics"
dynamic = ["version"]
description = "Orchestrator that runs multiple SBK (sbk-yal / sbk-gem-yal) benchmarks and feeds CSVs into sbk-charts for combined performance analytics."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "sbk-analytics contributors"}]
keywords = ["benchmark", "storage", "performance", "analytics", "sbk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
    "openpyxl>=3.1",
    "psutil>=5.9",
    "Pillow>=11.3; python_version < '3.10'",
    "Pillow>=12.0; python_version >= '3.10'",
    "openpyxl-image-loader>=1.0",
]

[project.urls]
Homepage = "https://github.com/kmgowda/sbk-analytics"
Documentation = "https://github.com/kmgowda/sbk-analytics#readme"
Repository = "https://github.com/kmgowda/sbk-analytics"
Issues = "https://github.com/kmgowda/sbk-analytics/issues"

[project.scripts]
sbk-analytics = "analytics.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["analytics*"]

[tool.setuptools.package-data]
analytics = ["banner.txt", "default-sbk-config.env", "README.md", "AGENTS.md", "ARCHITECTURE.md", "CONTRIBUTING.md", "DEVELOPMENT.md", "SUPPORT.md", "CHANGELOG.md", "CODEOWNERS"]

[tool.setuptools.dynamic]
version = {attr = "analytics.__version__"}
