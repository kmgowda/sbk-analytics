# sbk-analytics input configuration.
#
# Parameter groups:
#   1. mode             - serial | parallel  (default: serial)
#   2. sbk              - shared SBK / SBK-GEM-YAL defaults
#                          (presence of 'nodes' switches to sbk-gem-yal)
#   3. benchmarks       - list of benchmark instances
#   4. class_params     - (optional) per-class default overrides
#   5. sbk-charts       - sbk-charts options:
#                          output, ai_model, ai_params, chat
#                          (CSV inputs are auto-supplied by sbk-analytics
#                           from the SBK-instance CSVs; do not set them here)

mode: serial

# Optional. Defaults to /tmp/sbk-analytics. Holds generated YAMLs (yml/),
# per-instance CSVs (csv/), parallel-mode logs (logs/), and the final Excel
# report when `sbk-charts.output` is a bare filename.
workdir: /tmp/sbk-analytics

# Optional destructive pre-run cleanup. When true, every existing entry below
# workdir is removed once, after dependency validation and immediately before
# SBK/SBK-GEM starts. The workdir itself is preserved. Default: false.
cleanup_before_run: false

sbk:
  seconds: 60
  time: ms
  # Fixed-record runs can override the native 600-second idle limit:
  # idletimeoutseconds: 600
  # Distributed instances (those with nodes:) may also set packagescleanup,
  # fullcopy, hostkeycheck/knownhosts, sbmport/sbmsleepms, totalrecords, or
  # totalthroughput. SBK-GEM embeds SBM; analytics does not launch sbm directly.

benchmarks:
  - class: file
    writers: 1
    size: 100
    file: /tmp/sbk-analytics/file-write
  - class: file
    readers: 1
    size: 100
    file: /tmp/sbk-analytics/file-read
  - class: hdfs
    writers: 1
    size: 100
    uri: hdfs://localhost:9000
    fname: /tmp/sbk-analytics/hdfs

sbk-charts:
  output: sbk-analytics.xlsx
  ai_model: noai
  ai_params: {}
  chat: false
