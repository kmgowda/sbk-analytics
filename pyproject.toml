[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sbk-analytics"
version = "0.1.0"
description = "Orchestrator that runs multiple SBK (sbk-yal / sbk-gem-yal) benchmarks and feeds CSVs into sbk-charts for combined performance analytics."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "sbk-analytics contributors"}]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
    "openpyxl>=3.1",
    "psutil>=5.9",
    "Pillow>=12.0",
    "openpyxl-image-loader>=1.0",
]

[project.scripts]
sbk-analytics = "analytics.cli:main"

[tool.setuptools.packages.find]
include = ["analytics*"]

[tool.setuptools.package-data]
analytics = ["banner.txt"]
