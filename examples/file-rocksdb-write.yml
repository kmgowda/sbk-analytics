# sbk-analytics: single-writer benchmark on `file` and `rocksdb`, 120s each.
#
# Parameter resolution per instance (lowest to highest precedence):
#   1. shared `sbk:` block (defaults for ALL instances)
#   2. `class_params[<class>]` (per-class defaults, if any)
#   3. the instance's own keys under `benchmarks:` (per-instance overrides)
#   4. orchestrator-managed:  class, out=CSVLogger, csvfile=<unique-path>
#
# An instance therefore needs to specify only the parameters that differ from
# the shared `sbk:` defaults, plus any class-specific options (file path,
# rocksdb dir, kafka brokers, ...).

mode: serial

# All output -- generated SBK YAMLs, per-instance CSV files, and the final
# Excel report -- is written under this directory. Default: /tmp/sbk-analytics.
workdir: /tmp/sbk-analytics

# Shared SBK defaults. Any SBK parameter missing from an instance is taken
# from this block.
sbk:
  seconds: 120
  size: 100
  time: ms
  writers: 1          # default; can be overridden per instance

benchmarks:
  # File driver: only needs its class-specific param `file`.
  - class: file
    file: /tmp/sbk-analytics/file.dat

  # RocksDB driver: only needs `rfile`; all SBK params inherited.
  - class: rocksdb
    rfile: /tmp/sbk-analytics/rocksdb

# sbk-charts options. The input CSV files for sbk-charts are:
#   - one CSV per SBK instance above (auto-generated, do not set), PLUS
#   - any extra CSVs listed under `use_files:` (already-available benchmark
#     results from prior runs / other tools that you want to chart alongside).
# When `output:` is a bare filename it is placed inside `workdir:`.
sbk-charts:
  output: sbk-analytics.xlsx
  ai_model: noai          # huggingface | ollama | lmstudio | noai
  ai_params: {}           # passed as --key value to the AI sub-command
  chat: false             # sbk-charts -chat mode
  # use_files:            # optional list of pre-existing CSV files; resolved
  #   - baseline.csv      # relative to workdir, or use absolute paths.
  #   - /data/last-run.csv
