# Measure the datasets created by file/write.yml. Run write.yml first.
mode: serial
workdir: /tmp/sbk-analytics/benchmarks/file

# Preserve the prepared files. The write workflow owns data reset.
cleanup_before_run: false

sbk:
  time: ns
  idletimeoutseconds: 120

benchmarks:
  file-read-4k:
    file:
      readers: 1
      size: 4096
      records: 65536
      file: /tmp/sbk-analytics/benchmarks/file/file-4k.dat

  file-read-64k:
    file:
      readers: 1
      size: 65536
      records: 4096
      file: /tmp/sbk-analytics/benchmarks/file/file-64k.dat

sbk-charts:
  output: file-read.xlsx
  ai_model: noai
  chat: false
